name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          find . -name "*.sh" -type f | while read -r script; do
            echo "Checking $script..."
            shellcheck --severity=warning "$script" || true
          done

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: |
          find . -name "*.py" -type f | while read -r script; do
            echo "Checking $script..."
            python3 -m py_compile "$script"
          done

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal markdown links
        run: |
          errors=0
          # Check that markdown links to local files actually exist
          grep -roh '\[.*\]([^http][^)]*\.md)' --include="*.md" | \
            sed 's/.*(\(.*\))/\1/' | sort -u | while read -r link; do
              # Resolve relative to repo root
              if [ ! -f "$link" ]; then
                echo "Broken link: $link"
                errors=$((errors + 1))
              fi
            done
          if [ "$errors" -gt 0 ]; then
            echo "$errors broken link(s) found"
          fi

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for accidentally committed secrets or internal references
        run: |
          # Patterns that should NEVER appear in a public repo
          # Excludes vijan573.atlassian.net (public demo wiki) and your-org.atlassian.net (placeholder)
          PATTERNS="sharepoint\.com|@aetna|@cvshealth|password=|api_token=|secret_key="
          if grep -rn "$PATTERNS" --include="*.md" --include="*.sh" --include="*.py" --include="*.json" . | \
             grep -v "your-org\.atlassian\.net" | grep -v "vijan573\.atlassian\.net"; then
            echo "FAIL: Found patterns that look like internal references or secrets"
            exit 1
          else
            echo "PASS: No internal references or secrets found"
          fi
